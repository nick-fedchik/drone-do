name: Task
description: Produce or change a concrete project artifact
labels: ["type:task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What outcome is needed and why?
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and exclusions
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable checks for completion.
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related Work Products or Issues

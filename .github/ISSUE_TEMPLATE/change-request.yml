name: Change Request
description: Request a decision to change an agreed scope or Work Product
labels: ["type:change-request"]
body:
  - type: textarea
    id: target
    attributes:
      label: Target baseline
      description: Link the existing requirement, specification, design, or decision.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change and rationale
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Expected impact and alternatives
      description: Include interfaces, tests, safety, schedule, and migration impact where relevant.
    validations:
      required: true
  - type: dropdown
    id: decision
    attributes:
      label: Requested disposition
      options:
        - Decide
        - Defer
        - Reject
    validations:
      required: true
